name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # No Gradle wrapper needed: this installs Gradle 8.6 (what Loom 1.6 wants).
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.6

      - name: Build
        run: gradle build --stacktrace

      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: diansu-invictus
          path: build/libs/*.jar
